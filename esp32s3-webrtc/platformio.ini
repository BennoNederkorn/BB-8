[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.psram = true
board_build.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
board_upload.flash_size = 8MB

; # Enable IDF component manager
board_build.cmake_extra_args = 
    -DIDF_COMPONENT_MANAGER=ON

build_flags = 
    -D CONFIG_CAMERA_MODEL_ESP_EYE
    -D CAMERA_MODEL_ESP_EYE
    -D PWDN_GPIO_NUM=-1
    -D RESET_GPIO_NUM=-1
    -D XCLK_GPIO_NUM=15
    -D SIOD_GPIO_NUM=4
    -D SIOC_GPIO_NUM=5
    -D Y9_GPIO_NUM=16
    -D Y8_GPIO_NUM=17
    -D Y7_GPIO_NUM=18
    -D Y6_GPIO_NUM=12
    -D Y5_GPIO_NUM=11
    -D Y4_GPIO_NUM=10
    -D Y3_GPIO_NUM=9
    -D Y2_GPIO_NUM=13
    -D VSYNC_GPIO_NUM=6
    -D HREF_GPIO_NUM=7
    -D PCLK_GPIO_NUM=14
    -D CORE_DEBUG_LEVEL=5
