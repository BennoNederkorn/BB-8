; This file handles 
; - "Meta" configuration—upload speeds,
; - partition table selection,
; - board definition overrides. 
; It also controls the arguments passed to the idf.py build command 
; and determines which pre-compiled bootloader binaries are used.

; -----------------------------------------------------------------------
; PlatformIO Project Configuration for ESP32-S3-EYE V2.2
; -----------------------------------------------------------------------
[platformio]
default_envs = esp32-s3-eye

[env:esp32-s3-eye]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; -----------------------------------------------------------------------
; 1. Memory Subsystem Configuration (CRITICAL)
; -----------------------------------------------------------------------
; The S3-EYE V2.2 uses 8MB Octal SPI (OPI) PSRAM and 8MB Flash.
; The defaults must be overriden to prevent boot loops.
; 'qio_opi' = Quad I/O for Bootloader,
; Octal I/O for Application/PSRAM.
board_build.arduino.memory_type = qio_opi
; Force flash mode to Quad I/O (compatible start)
board_build.flash_mode = qio
; Explicitly define the PSRAM type as Octal
board_build.psram_type = opi

; -----------------------------------------------------------------------
; 2. Flash Size and Partitioning
; -----------------------------------------------------------------------
; Default devkits are often 4MB. The EYE is 8MB.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; Use a custom partition table to accommodate large AI models (ESP-DL)
board_build.partitions = partitions.csv

; -----------------------------------------------------------------------
; 3. Build Flags and Definitions
; -----------------------------------------------------------------------
build_flags = 
    ; Hardware Definition for conditional compilation
    -DESP32_S3_EYE
    -DBOARD_HAS_PSRAM
    ; Workaround for potential cache coherency issues in early silicon
    -mfix-esp32-psram-cache-issue
    ; USB Configuration for Native JTAG/Serial
    -DCONFIG_USB_OTG_SUPPORTED

; -----------------------------------------------------------------------
; 4. Debugging and Monitor
; -----------------------------------------------------------------------
; The S3-EYE uses the built-in USB-JTAG for upload and debug.
upload_protocol = esp-builtin
debug_tool = esp-builtin
debug_init_break = tbreak setup

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
