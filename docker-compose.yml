version: '3.8'

services:
  # --- The ROS 2 Control Node ---
  ros-control:
    build: ./ros_control
    image: bb-8_ros-control         # Names the built image for easy reference  
    container_name: ros_control
    restart: always
    network_mode: "host"            # Host networking allows this node to see the AI node automatically
    # This grants the container access to your ESP32.
    # Change '/dev/ttyUSB0' to the *actual* port you found on your Jetson
    #    (e.g., /dev/ttyUSB0, /dev/ttyUSB1, or /dev/ttyACM0).
    # devices:
    #  - "/dev/ttyUSB0:/dev/ttyUSB0"
    # 'privileged' is often required for direct hardware access
    privileged: true
    volumes:
      # Mounts the host's ros_ws into the container for live development
      - ./ros_control/ros_ws:/root/ros_ws
    # This command keeps the container alive in the background
    # so you can 'exec' into it for development.
    command: tail -f /dev/null


  # --- The AI Inference Node ---
  ai-inference:
    build:
      context: ./ai_inference/jetson-inference
      dockerfile: Dockerfile
    container_name: ai_inference
    restart: always
    network_mode: "host"          # Host networking allows this node to see the ROS node automatically
    runtime: nvidia               # Enables container access to the GPU
    working_dir: /jetson-inference
    tty: true
    stdin_open: true
    devices:
      # Grants container access to the camera
      # !! MODIFY "/dev/video0" if your camera is different !!
      - "/dev/video0:/dev/video0"
    ports:
      # Exposes the AI's internal API port
      - "5000:5000"
    volumes:
      # Persist/download models and datasets across container rebuilds
      - ./ai_inference/jetson-inference/data:/jetson-inference/data
      - ./ai_inference/jetson-inference/python/training/classification/data:/jetson-inference/python/training/classification/data
      - ./ai_inference/jetson-inference/python/training/classification/models:/jetson-inference/python/training/classification/models
      - ./ai_inference/jetson-inference/python/training/detection/ssd/data:/jetson-inference/python/training/detection/ssd/data
      - ./ai_inference/jetson-inference/python/training/detection/ssd/models:/jetson-inference/python/training/detection/ssd/models
      - ./ai_inference/jetson-inference/python/www/recognizer/data:/jetson-inference/python/www/recognizer/data
      - ./ai_inference/jetson-inference/python/www/dash:/jetson-inference/python/www/dash
      
      # Hardware/System Passthrough
      - /tmp/argus_socket:/tmp/argus_socket
      - /etc/enctune.conf:/etc/enctune.conf
      - /etc/nv_tegra_release:/etc/nv_tegra_release
      - /proc/device-tree/model:/tmp/nv_jetson_model
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - /tmp/.X11-unix:/tmp/.X11-unix

    environment:
      # Required by some Jetson containers when using GPU/graphics
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
    # Notes:
    # - This service is now built from ai_inference/jetson-inference.
    # - To add more AI inference containers, create additional subdirectories
    #   under ai_inference/<model-or-app>/ with their own Dockerfile and add
    #   new services here with build.context pointing to them.